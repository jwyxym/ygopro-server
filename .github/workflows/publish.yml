name: Publish to crates.io

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          with open("Cargo.toml", encoding="utf-8") as manifest:
              contents = manifest.read()
          package = re.search(r"(?ms)^\[package\][ \t]*(?:#[^\n]*)?\n.*?(?=^\[|\Z)", contents)
          if package is None:
              raise SystemExit("Cargo.toml is missing the [package] table")
          version = tomllib.loads(package.group())["package"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", tag) or tag != version:
              raise SystemExit(f"Release tag {tag!r} must match package version {version!r}")
          PY

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_KEY }}
